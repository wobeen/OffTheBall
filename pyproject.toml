[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "offtheball"
version = "0.2.0"
description = "Local football video analysis prototype"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy<3", "opencv-python<5", "mss<11", "Pillow<13", "ultralytics<9", "requests<3", "lap==0.5.13", "scipy<2"]

[project.optional-dependencies]
dev = ["pytest<10"]

[project.scripts]
offtheball = "offtheball.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
